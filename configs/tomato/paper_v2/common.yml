# Native DEIMv2-L architecture/optimizer; one shared 120e tomato recipe.
__include__: ['../../deimv2/deimv2_dinov3_l_coco.yml']
num_classes: 3
remap_mscoco_category: false
epoches: 120
use_amp: true
use_ema: true
lrsheduler: flatcosine
warmup_iter: 2000
flat_epoch: 60
no_aug_epoch: 14
lr_gamma: 0.5
output_dir: ./outputs/paper_v2
print_freq: 100
checkpoint_freq: 10
paper_v2:
  selection: ema_mixed_validation_ap
  tie_rule: earliest_epoch
DINOv3STAs:
  weights_path: ${DINOV3_WEIGHTS}
PostProcessor:
  category_ids: [1, 2, 3]
DEIMCriterion:
  gamma: 1.5
  matcher:
    matcher_change_epoch: 88
train_dataloader:
  total_batch_size: 32
  dataset:
    img_folder: ${TOMATO_DATA_ROOT}/images/train
    ann_file: ${TOMATO_DATA_ROOT}/annotations/instances_train.json
    category_ids: [1, 2, 3]
    transforms:
      policy:
        epoch: [7, 60, 106]
  collate_fn:
    mixup_epochs: [7, 60]
    copyblend_epochs: [7, 106]
    stop_epoch: 106
val_dataloader:
  total_batch_size: 64
  dataset:
    img_folder: ${TOMATO_DATA_ROOT}/images/val
    ann_file: ${TOMATO_DATA_ROOT}/annotations/instances_val.json
    category_ids: [1, 2, 3]
tomato:
  detector_checkpoint: ${TOMATO_DETECTOR_CHECKPOINT}
  visible_mask_train: ${TOMATO_DATA_ROOT}/annotations/visible_masks_train.json
  seeds: [0, 42, 3407]
innovation:
  instance_mask_sync: false
  gr_vq: {enabled: false, beta: 0.10}
  li_copyblend:
    enabled: false
    illumination_sampling: true
    foreground_only: true
    light_policy: strict
    local_photometry: true
    photometry_threshold: 0.20
    max_retries: 20
    max_donor_attempts: 12
    collision_tolerance: 0.0
    num_classes: 3
    normalized: true
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
  dc_sta: {enabled: false, alpha: 0.1}
