protocol_id: feature_kd_ms_v1
stage_policy: continuous_no_rollback
seeds: [0, 42, 3407]
selection: ema_mixed_validation_ap
tie_rule: earliest_epoch
native:
  task: detection
  criterion: DEIMCriterion
  postprocessor: PostProcessor
  evaluator: {type: CocoEvaluator, iou_types: [bbox]}
  output_dir: outputs/thesis_kd/feature_kd_ms_v1
  epoches: 120
  use_amp: true
  use_ema: true
  sync_bn: true
  # Native denoising inputs can be absent on a rank with only empty GTs.
  # The wrapper independently checks every active projection participates.
  find_unused_parameters: true
  ema: {type: ModelEMA, decay: 0.9999, warmups: 1000, start: 0}
  lrsheduler: flatcosine
  lr_gamma: 0.5
  warmup_iter: 2000
  flat_epoch: 60
  no_aug_epoch: 14
  clip_max_norm: 0.1
  optimizer:
    type: AdamW
    lr: 0.0005
    backbone_lr: 0.000025
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    projector_lr: 0.0005
    projector_weight_decay: 0.0001
  DEIMCriterion:
    weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
    losses: [mal, boxes, local]
    gamma: 1.5
    alpha: 0.75
    reg_max: 32
    matcher:
      type: HungarianMatcher
      weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
      alpha: 0.25
      gamma: 2.0
      change_matcher: true
      iou_order_alpha: 4.0
      matcher_change_epoch: 88
  train_dataloader:
    total_batch_size: 32
    num_workers: 4
    drop_last: true
    shuffle: true
    dataset:
      transforms:
        type: Compose
        ops:
          - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: true, max_cached_images: 50, random_pop: true}
          - {type: RandomPhotometricDistort, p: 0.5}
          - {type: RandomZoomOut, fill: 0}
          - {type: RandomIoUCrop, p: 0.8}
          - {type: SanitizeBoundingBoxes, min_size: 1}
          - {type: RandomHorizontalFlip}
          - {type: Resize, size: [640, 640]}
          - {type: SanitizeBoundingBoxes, min_size: 1}
          - {type: ConvertPILImage, dtype: float32, scale: true}
          - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
          - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
        policy:
          name: stop_epoch
          epoch: [7, 60, 106]
          ops: [Mosaic, RandomPhotometricDistort, RandomZoomOut, RandomIoUCrop]
        mosaic_prob: 0.5
    collate_fn:
      type: BatchImageCollateFunction
      base_size: 640
      base_size_repeat: 6
      mixup_prob: 0.5
      copyblend_prob: 0.5
      mixup_epochs: [7, 60]
      copyblend_epochs: [7, 106]
      stop_epoch: 106
      area_threshold: 100
      num_objects: 3
      with_expand: true
      expand_ratios: [0.1, 0.25]
      ema_restart_decay: 0.9999
  val_dataloader:
    total_batch_size: 64
    num_workers: 4
    shuffle: false
    drop_last: false
    dataset:
      transforms:
        type: Compose
        ops:
          - {type: Resize, size: [640, 640]}
          - {type: ConvertPILImage, dtype: float32, scale: true}
          - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    collate_fn: {type: BatchImageCollateFunction}
